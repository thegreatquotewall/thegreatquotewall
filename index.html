<!DOCTYPE html>
<html>
<head>
  <title>The Great Quote Wall</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #141e30, #243b55);
      color: white;
      text-align: center;
    }

    h1 {
      margin-top: 30px;
      font-size: 28px;
    }

    .submit-btn {
      margin-top: 10px;
      padding: 10px 20px;
      border: none;
      border-radius: 10px;
      background: #00d4ff;
      color: black;
      font-weight: bold;
      cursor: pointer;
    }

    #quotes {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      padding: 20px;
    }

    .quote {
      background: rgba(255, 255, 255, 0.08);
      border-radius: 15px;
      padding: 20px;
      width: 300px;
      transition: 0.3s;
      box-shadow: 0 5px 20px rgba(0,0,0,0.3);
    }

    .quote:hover {
      transform: scale(1.05);
    }

    small {
      color: #00d4ff;
    }

    .like-btn {
      margin-top: 10px;
      padding: 8px 15px;
      border: none;
      border-radius: 8px;
      background: #ff4d6d;
      color: white;
      cursor: pointer;
    }
  </style>
</head>

<body>

<h1>The Great Quote Wall</h1>

<a href="https://docs.google.com/forms/d/e/1FAIpQLScaFHGWChDKDjEWFNFUanL-EULR86040LQsjJoRNpirWLsvgg/viewform" target="_blank">
  <button class="submit-btn">Submit Your Quote</button>
</a>

<div id="quotes"></div>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycbwI__k7hVY2RQz_3b0LLuKnILLASwhwCluIv0j2DyDhyEVUo9W-MmKQ_hYdfvirO94/exec";

fetch("https://opensheet.elk.sh/1IsFf9908tNuAtJ946L35LaJGHA9Fb0RSBJzUNkFzx_8/Form%20responses%201")
.then(response => response.json())
.then(data => {

  const container = document.getElementById("quotes");
  container.innerHTML = "";

  data.forEach((item, index) => {

    const quoteText = item["Enter your quote (max 25 words)"];
    const name = item["Your Name"];
    const category = item["Category"];
    const likes = item["Likes"] || 0;

    if(!quoteText) return;

    const div = document.createElement("div");
    div.className = "quote";

    div.innerHTML = `
      <h2>"${quoteText}"</h2>
      <p>- ${name || "Anonymous"}</p>
      <small>${category || ""}</small>
      <br><br>
      <button class="like-btn" onclick="likeQuote(${index + 2})">❤️ Like</button>
      <p>${likes} Likes</p>
    `;

    container.appendChild(div);

  });

});

function likeQuote(row) {

  fetch(API_URL, {
    method: "POST",
    body: JSON.stringify({ row: row })
  })
  .then(() => {
    location.reload();
  });

}

</script>

</body>
</html>
