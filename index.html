<!DOCTYPE html>
<html>
<head>
  <title>The Great Quote Wall</title>

  <style>
body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
  color: white;
}

h1 {
  text-align: center;
  margin-top: 30px;
  font-size: 32px;
  letter-spacing: 1px;
}

.top-bar {
  text-align: center;
  margin: 20px;
}

.submit-btn {
  padding: 10px 20px;
  border-radius: 25px;
  border: none;
  background: linear-gradient(45deg, #00d4ff, #00ffa6);
  font-weight: bold;
  cursor: pointer;
  transition: 0.3s;
}

.submit-btn:hover {
  transform: scale(1.05);
}

input, select {
  padding: 10px;
  border-radius: 20px;
  border: none;
  margin: 5px;
  outline: none;
}

#quotes {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 25px;
  padding: 30px;
}

.quote {
  background: rgba(255,255,255,0.08);
  backdrop-filter: blur(10px);
  border-radius: 20px;
  padding: 20px;
  transition: 0.3s;
  box-shadow: 0 10px 25px rgba(0,0,0,0.3);
}

.quote:hover {
  transform: translateY(-8px);
}

.quote h2 {
  font-size: 20px;
}

.quote p {
  margin-top: 10px;
  font-size: 14px;
  opacity: 0.8;
}

.like-btn {
  margin-top: 10px;
  padding: 8px 15px;
  border-radius: 20px;
  border: none;
  background: linear-gradient(45deg, #ff4d6d, #ff758c);
  color: white;
  cursor: pointer;
  transition: 0.3s;
}

.like-btn:hover {
  transform: scale(1.1);
}

.liked {
  background: gray !important;
  cursor: not-allowed;
}
  </style>
</head>

<body>

<h1>The Great Quote Wall</h1>

<a href="https://docs.google.com/forms/d/e/1FAIpQLScaFHGWChDKDjEWFNFUanL-EULR86040LQsjJoRNpirWLsvgg/viewform" target="_blank">
  <button class="submit-btn">Submit Your Quote</button>
</a>

<br><br>

<input type="text" id="searchInput" placeholder="Search quotes..." onkeyup="filterQuotes()">

<select id="categoryFilter" onchange="filterQuotes()">
  <option value="All">All Categories</option>
  <option value="Discipline">Discipline</option>
  <option value="Motivation">Motivation</option>
  <option value="Success">Success</option>
  <option value="Life">Life</option>
  <option value="Love">Love</option>
  <option value="Dreams">Dreams</option>
  <option value="Pain">Pain</option>
  <option value="Wisdom">Wisdom</option>
</select>

<div id="quotes"></div>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycbwI__k7hVY2RQz_3b0LLuKnILLASwhwCluIv0j2DyDhyEVUo9W-MmKQ_hYdfvirO94/exec";

const SHEET_URL = "https://opensheet.elk.sh/1IsFf9908tNuAtJ946L35LaJGHA9Fb0RSBJzUNkFzx_8/Form%20responses%201";

let allQuotes = [];

fetch(SHEET_URL)
.then(res => res.json())
.then(data => {
  // Sort by likes (highest first)
  data.sort((a, b) => (b["Likes"] || 0) - (a["Likes"] || 0));

  allQuotes = data;
  displayQuotes(data);
});

function displayQuotes(data) {
  const container = document.getElementById("quotes");
  container.innerHTML = "";

  data.forEach((item, index) => {

    const quote = item["Enter your quote (max 25 words)"];
    const name = item["Your Name"];
    const category = item["Category"];
    const likes = item["Likes"] || 0;

    if (!quote) return;

    const rowNumber = index + 2;
    const alreadyLiked = localStorage.getItem("liked_" + rowNumber);

    const div = document.createElement("div");
    div.className = "quote";

    div.innerHTML = `
      <h2>"${quote}"</h2>
      <p>- ${name || "Anonymous"}</p>
      <small>${category || ""}</small>
      <br><br>
      <button class="like-btn ${alreadyLiked ? 'liked' : ''}" 
              onclick="likeQuote(${rowNumber}, this)" 
              ${alreadyLiked ? 'disabled' : ''}>
        ${alreadyLiked ? 'Liked ❤️' : '❤️ Like'}
      </button>
      <p>${likes} Likes</p>
    `;

    container.appendChild(div);
  });
}

function filterQuotes() {
  const searchValue = document.getElementById("searchInput").value.toLowerCase();
  const selectedCategory = document.getElementById("categoryFilter").value;

  const filtered = allQuotes.filter(item => {
    const quote = (item["Enter your quote (max 25 words)"] || "").toLowerCase();
    const name = (item["Your Name"] || "").toLowerCase();
    const category = item["Category"] || "";

    return (
      (quote.includes(searchValue) || name.includes(searchValue)) &&
      (selectedCategory === "All" || category === selectedCategory)
    );
  });

  displayQuotes(filtered);
}

function likeQuote(row, btn) {

  if (localStorage.getItem("liked_" + row)) {
    alert("You already liked this 👍");
    return;
  }

  fetch(API_URL, {
    method: "POST",
    body: JSON.stringify({ row: row })
  })
  .then(() => {

    localStorage.setItem("liked_" + row, true);

    btn.innerText = "Liked ❤️";
    btn.classList.add("liked");
    btn.disabled = true;

    setTimeout(() => {
      location.reload();
    }, 500);
  });
}

</script>

</body>
</html>
