<!DOCTYPE html>
<html>
<head>
  <title>The Great Quote Wall</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(to bottom, #1e3c72, #2a5298);
      color: white;
      text-align: center;
    }

    h1 {
      margin-top: 30px;
    }

    .subtitle {
      margin-bottom: 20px;
      color: #ddd;
    }

    .submit-btn {
      background: #00c6ff;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    .search-box {
      margin-top: 20px;
    }

    input, select {
      padding: 10px;
      border-radius: 6px;
      border: none;
      margin: 5px;
    }

    #quotes {
      margin-top: 30px;
    }

    .quote {
      background: rgba(255,255,255,0.1);
      padding: 20px;
      margin: 15px auto;
      border-radius: 12px;
      width: 80%;
      max-width: 400px;
    }

    .like-btn {
      background: #ff4d6d;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      color: white;
      cursor: pointer;
      margin-top: 10px;
    }

    .footer {
      margin-top: 50px;
      padding: 20px;
      font-size: 14px;
      color: #ccc;
    }
  </style>
</head>

<body>

<h1>🌍 The Great Quote Wall</h1>
<p class="subtitle">Share your words. Inspire the world.</p>

<a href="https://docs.google.com/forms" target="_blank">
  <button class="submit-btn">🔥 Submit Your Quote</button>
</a>

<div class="search-box">
  <input type="text" id="searchInput" placeholder="Search your name or quote..." onkeyup="filterQuotes()">
  
  <select id="categoryFilter" onchange="filterQuotes()">
    <option value="All">All Categories</option>
    <option value="Discipline">Discipline</option>
    <option value="Motivation">Motivation</option>
    <option value="Success">Success</option>
    <option value="Life">Life</option>
    <option value="Love">Love</option>
    <option value="Dreams">Dreams</option>
    <option value="Pain">Pain</option>
    <option value="Wisdom">Wisdom</option>
  </select>
</div>

<h2>🔥 Community Quotes</h2>

<div id="quotes"></div>

<div class="footer">
  Made with ❤️ | The Great Quote Wall
</div>

<script>
const API_URL = "YOUR_WEB_APP_URL_HERE";
const SHEET_URL = "YOUR_SHEET_JSON_URL_HERE";

let allQuotes = [];

fetch(SHEET_URL)
  .then(res => res.json())
  .then(data => {
    allQuotes = data;
    displayQuotes(data);
  });

function displayQuotes(data) {
  const container = document.getElementById("quotes");
  container.innerHTML = "";

  if (data.length === 0) {
    container.innerHTML = "<p>No quotes found. Be the first to share yours!</p>";
    return;
  }

  data.forEach((item, index) => {
    const quote = item["Enter your quote (max 25 words)"];
    const name = item["Your Name"];
    const category = item["Category"];
    const likes = item["Likes"] || 0;

    if (!quote) return;

    const rowNumber = index + 2;
    const alreadyLiked = localStorage.getItem("liked_" + rowNumber);

    const div = document.createElement("div");
    div.className = "quote";

    div.innerHTML = `
      <h3>"${quote}"</h3>
      <p>- ${name || "Anonymous"}</p>
      <small>${category || "-"}</small><br><br>

      <button class="like-btn"
        onclick="likeQuote(${rowNumber}, this)"
        ${alreadyLiked ? "disabled" : ""}>
        ${alreadyLiked ? "Liked ❤️" : "❤️ Like"}
      </button>

      <p>${likes} Likes</p>
    `;

    container.appendChild(div);
  });
}

function likeQuote(row, btn) {
  fetch(API_URL, {
    method: "POST",
    body: JSON.stringify({ row: row })
  })
  .then(() => {
    localStorage.setItem("liked_" + row, true);
    btn.innerText = "Liked ❤️";
    btn.disabled = true;
  });
}

function filterQuotes() {
  const search = document.getElementById("searchInput").value.toLowerCase();
  const category = document.getElementById("categoryFilter").value;

  const filtered = allQuotes.filter(item => {
    const quote = (item["Enter your quote (max 25 words)"] || "").toLowerCase();
    const name = (item["Your Name"] || "").toLowerCase();
    const cat = item["Category"];

    return (
      (quote.includes(search) || name.includes(search)) &&
      (category === "All" || cat === category)
    );
  });

  displayQuotes(filtered);
}
</script>

</body>
</html>
