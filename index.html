<!DOCTYPE html>
<html>
<head>
  <title>The Great Quote Wall</title>

  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #1e3c72, #2a5298);
      color: white;
      text-align: center;
    }

    h1 { margin-top: 30px; }

    .subtitle {
      color: #ddd;
      margin-bottom: 20px;
    }

    .submit-btn {
      background: linear-gradient(45deg, #00c6ff, #0072ff);
      border: none;
      padding: 14px 24px;
      border-radius: 10px;
      color: white;
      font-size: 16px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }

    .search-box {
      margin-top: 20px;
    }

    input, select {
      padding: 10px;
      border-radius: 8px;
      border: none;
      margin: 5px;
    }

    #quotes {
      margin-top: 30px;
    }

    .quote {
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(10px);
      padding: 25px;
      margin: 20px auto;
      border-radius: 16px;
      width: 85%;
      max-width: 420px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.3);
    }

    .like-btn {
      background: #ff4d6d;
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      color: white;
      cursor: pointer;
      margin: 5px;
    }

    .share-btn {
      background: #25D366;
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      color: white;
      cursor: pointer;
      margin: 5px;
    }

    .insta-btn {
      background: #E1306C;
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      color: white;
      cursor: pointer;
      margin: 5px;
    }

    .footer {
      margin-top: 40px;
      padding: 20px;
      color: #ccc;
    }
  </style>
</head>

<body>

<h1>🌍 The Great Quote Wall</h1>
<p class="subtitle">Share your words. Inspire the world.</p>

<a href="https://docs.google.com/forms/d/e/1FAIpQLScaFHGWChDKDjEWFNFUanL-EULR86040LQsjJoRNpirWLsvgg/viewform" target="_blank">
  <button class="submit-btn">🔥 Submit Your Quote</button>
</a>

<div class="search-box">
  <input type="text" id="searchInput" placeholder="Search your name or quote..." onkeyup="filterQuotes()">
  
  <select id="categoryFilter" onchange="filterQuotes()">
    <option value="All">All Categories</option>
    <option value="Discipline">Discipline</option>
    <option value="Motivation">Motivation</option>
    <option value="Success">Success</option>
    <option value="Life">Life</option>
    <option value="Love">Love</option>
    <option value="Dreams">Dreams</option>
    <option value="Pain">Pain</option>
    <option value="Wisdom">Wisdom</option>
  </select>
</div>

<p style="color:#ddd;">🔍 Search your name or quote to find your submission</p>

<h2>🔥 Community Quotes</h2>

<div id="quotes"></div>

<div class="footer">
  Made with ❤️ | The Great Quote Wall
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbwI__k7hVY2RQz_3b0LLuKnILLASwhwCluIv0j2DyDhyEVUo9W-MmKQ_hYdfvirO94/exec";

const SHEET_URL = "https://opensheet.elk.sh/1IsFf9908tNuAtJ946L35LaJGHA9Fb0RSBJzUNkFzx_8/Form%20responses%201";

let allQuotes = [];

fetch(SHEET_URL)
  .then(res => res.json())
  .then(data => {
    allQuotes = data;
    const approved = data.filter(item => item["Status"] === "Approved");
    displayQuotes(approved);
  });

function displayQuotes(data) {
  const container = document.getElementById("quotes");
  container.innerHTML = "";

  data.forEach((item, index) => {

    const quote = item["Enter your quote (max 25 words)"];
    const name = item["Your Name"];
    const category = item["Category"];
    const likes = item["Likes"] || 0;
    const social = item["Social link (Instagram or Facebook)"];

    if (!quote) return;

    const rowNumber = index + 2;
    const alreadyLiked = localStorage.getItem("liked_" + rowNumber);

    const shareText = encodeURIComponent(
      `"${quote}" - ${name}\n\nSubmit yours 👉 https://thegreatquotewall.github.io/thegreatquotewall/`
    );

    const div = document.createElement("div");
    div.className = "quote";

    div.innerHTML = `
      <h3>"${quote}"</h3>
      <p>- ${name || "Anonymous"}</p>
      <small>${category || "-"}</small><br>

      ${social ? `
      <a href="${social}" target="_blank">
        <button class="insta-btn">📸 Instagram</button>
      </a>` : ""}

      <br>

      <button class="like-btn"
        onclick="likeQuote(${rowNumber}, this)"
        ${alreadyLiked ? "disabled" : ""}>
        ${alreadyLiked ? "Liked ❤️" : "❤️ Like"}
      </button>

      <a href="https://wa.me/?text=${shareText}" target="_blank">
        <button class="share-btn">📲 Share</button>
      </a>

      <p>${likes} Likes</p>
    `;

    container.appendChild(div);
  });
}

function likeQuote(row, btn) {
  fetch(API_URL, {
    method: "POST",
    body: JSON.stringify({ row: row })
  })
  .then(() => {
    localStorage.setItem("liked_" + row, true);
    btn.innerText = "Liked ❤️";
    btn.disabled = true;
  });
}

function filterQuotes() {
  const search = document.getElementById("searchInput").value.toLowerCase();
  const category = document.getElementById("categoryFilter").value;

  const filtered = allQuotes.filter(item => {
    const quote = (item["Enter your quote (max 25 words)"] || "").toLowerCase();
    const name = (item["Your Name"] || "").toLowerCase();
    const cat = item["Category"];
    const status = item["Status"];

    return (
      status === "Approved" &&
      (quote.includes(search) || name.includes(search)) &&
      (category === "All" || cat === category)
    );
  });

  displayQuotes(filtered);
}
</script>

</body>
</html>
