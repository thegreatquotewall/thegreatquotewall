<!DOCTYPE html>
<html>
<head>
  <title>The Great Quote Wall</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #141e30, #243b55);
      color: white;
      text-align: center;
    }

    h1 {
      margin-top: 30px;
      font-size: 28px;
    }

    .submit-btn {
      margin-top: 15px;
      padding: 10px 20px;
      border: none;
      border-radius: 10px;
      background: #00d4ff;
      color: black;
      font-weight: bold;
      cursor: pointer;
    }

    #quotes {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      padding: 20px;
    }

    .quote {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 15px;
      padding: 20px;
      width: 300px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    }

    .like-btn {
      margin-top: 10px;
      padding: 8px 15px;
      border: none;
      border-radius: 8px;
      background: #ff4d6d;
      color: white;
      cursor: pointer;
    }

    .liked {
      background: gray !important;
      cursor: not-allowed;
    }
  </style>
</head>

<body>

<h1>The Great Quote Wall</h1>

<a href="https://docs.google.com/forms/d/e/1FAIpQLScaFHGWChDKDjEWFNFUanL-EULR86040LQsjJoRNpirWLsvgg/viewform" target="_blank">
  <button class="submit-btn">Submit Your Quote</button>
</a>

<div id="quotes"></div>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycbwI__k7hVY2RQz_3b0LLuKnILLASwhwCluIv0j2DyDhyEVUo9W-MmKQ_hYdfvirO94/exec";

const SHEET_URL = "https://opensheet.elk.sh/1IsFf9908tNuAtJ946L35LaJGHA9Fb0RSBJzUNkFzx_8/Form%20responses%201";

fetch(SHEET_URL)
.then(res => res.json())
.then(data => {

  const container = document.getElementById("quotes");
  container.innerHTML = "";

  data.forEach((item, index) => {

    const quote = item["Enter your quote (max 25 words)"];
    const name = item["Your Name"];
    const category = item["Category"];
    const likes = item["Likes"] || 0;

    if (!quote) return;

    const rowNumber = index + 2;

    const alreadyLiked = localStorage.getItem("liked_" + rowNumber);

    const div = document.createElement("div");
    div.className = "quote";

    div.innerHTML = `
      <h2>"${quote}"</h2>
      <p>- ${name || "Anonymous"}</p>
      <small>${category || ""}</small>
      <br><br>
      <button class="like-btn ${alreadyLiked ? 'liked' : ''}" 
              onclick="likeQuote(${rowNumber}, this)" 
              ${alreadyLiked ? 'disabled' : ''}>
        ${alreadyLiked ? 'Liked ❤️' : '❤️ Like'}
      </button>
      <p>${likes} Likes</p>
    `;

    container.appendChild(div);

  });

});

function likeQuote(row, btn) {

  // Prevent multiple likes
  if (localStorage.getItem("liked_" + row)) {
    alert("You already liked this quote 👍");
    return;
  }

  fetch(API_URL, {
    method: "POST",
    body: JSON.stringify({ row: row })
  })
  .then(() => {

    // Save in browser
    localStorage.setItem("liked_" + row, true);

    // Update button instantly
    btn.innerText = "Liked ❤️";
    btn.classList.add("liked");
    btn.disabled = true;

    // Reload to update count
    setTimeout(() => {
      location.reload();
    }, 500);

  })
  .catch(() => {
    alert("Error liking quote");
  });
}

</script>

</body>
</html>
